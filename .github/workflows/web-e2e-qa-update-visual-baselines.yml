name: web-e2e-qa / update-visual-baselines
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: web-e2e-qa
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04   # Playwright 1.57 has no browser builds for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=visual --update-snapshots
      - name: commit Linux baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          git diff --cached --quiet || git commit -m "Update visual baselines (Linux)"
          git push
