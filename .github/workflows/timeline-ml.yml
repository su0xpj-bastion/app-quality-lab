name: timeline-ml
on:
  push:
    paths: ["timeline-ml/**", ".github/workflows/timeline-ml.yml"]
  pull_request:
    paths: ["timeline-ml/**", ".github/workflows/timeline-ml.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: timeline-ml
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  gates:
    name: Gates (XCTest + fault matrix)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - run: scripts/ci/gates.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports, path: timeline-ml/build/reports}
