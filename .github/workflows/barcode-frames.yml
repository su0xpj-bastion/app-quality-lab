name: barcode-frames
on:
  push:
    paths: ["barcode-frames/**", ".github/workflows/barcode-frames.yml"]
  pull_request:
    paths: ["barcode-frames/**", ".github/workflows/barcode-frames.yml"]
defaults:
  run:
    working-directory: barcode-frames
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - run: swift test
      - run: swift run bf
      - run: swift run bf faults
      - run: swift run bf probe
      - name: CLT-only build path still works
        run: scripts/build-local.sh check
