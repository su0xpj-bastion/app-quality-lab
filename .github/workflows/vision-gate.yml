name: vision-gate
on:
  push:
    paths: ["vision-gate/**", ".github/workflows/vision-gate.yml"]
  pull_request:
    paths: ["vision-gate/**", ".github/workflows/vision-gate.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: vision-gate
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  macos:
    name: Gates on macOS (XCTest + fault matrix + baseline)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - run: scripts/ci/gates.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: macos-reports, path: vision-gate/build/reports}
  ios-sim:
    name: Gates on the iOS Simulator
    needs: macos            # one macOS runner at a time (free accounts share ~5)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/ios-sim.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-sim-reports, path: vision-gate/build/reports}
